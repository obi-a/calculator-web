name: CI/CD

on:
 push:
   branches: [ main ]
 pull_request:
   branches: [ main ]

jobs:
 test:
   runs-on: ubuntu-latest
   services:
     postgres:
       image: postgres:18
       env:
         POSTGRES_USER: postgres
         POSTGRES_PASSWORD: postgres
         POSTGRES_DB: fastapi_test_db
       ports:
         - 5432:5432
       options: >-
         --health-cmd "pg_isready -U postgres -d fastapi_test_db"
         --health-interval 10s
         --health-timeout 5s
         --health-retries 5
   env:
     DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastapi_test_db
   steps:
     - uses: actions/checkout@v5
     - uses: actions/setup-python@v6
       with:
         python-version: '3.10'

     - uses: actions/cache@v5
       with:
         path: |
           venv
           ~/.cache/pip
         key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
         restore-keys: |
           ${{ runner.os }}-pip-

     - name: Install dependencies
       run: |
         python -m venv venv
         source venv/bin/activate
         pip install -r requirements.txt
         playwright install --with-deps chromium

     - name: Run tests
       run: |
         source venv/bin/activate
         pytest tests/unit/ --junitxml=test-results/unit.xml
         pytest tests/integration/ --junitxml=test-results/integration.xml
         pytest tests/e2e/ --junitxml=test-results/e2e.xml

 security:
   needs: test
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v5

     - name: Build image
       run: docker build -t app:test .

     - name: Run Trivy vulnerability scanner
       uses: aquasecurity/trivy-action@master
       with:
         image-ref: 'app:test'
         format: 'table'
         exit-code: '1'
         ignore-unfixed: true
         severity: 'CRITICAL,HIGH'

 deploy:
   needs: security
   if: github.ref == 'refs/heads/main'
   runs-on: ubuntu-latest
   environment: production
   steps:
     - uses: actions/checkout@v5

     - uses: docker/setup-buildx-action@v4

     - uses: docker/login-action@v4
       with:
         username: ${{ secrets.DOCKERHUB_USERNAME }}
         password: ${{ secrets.DOCKERHUB_TOKEN }}

     - uses: docker/build-push-action@v7
       with:
         push: true
         tags: |
           decodeinvesting/calculator-web:latest
           decodeinvesting/calculator-web:${{ github.sha }}
         platforms: linux/amd64,linux/arm64
         cache-from: type=registry,ref=decodeinvesting/calculator-web:cache
         cache-to: type=inline,mode=max
